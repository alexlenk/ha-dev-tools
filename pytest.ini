[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests with HA fixtures
    property: Property-based tests
    integration: Integration tests with HA web component
norecursedirs = .git .hypothesis __pycache__ .pytest_cache

# Home Assistant test configuration
# These settings are used by pytest-homeassistant-custom-component
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::aiohttp.web_exceptions.NotAppKeyWarning