[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-dev-tools"
version = "1.0.0"
description = "Home Assistant Development Tools Integration"
requires-python = ">=3.14"

# Pytest config lives in pytest.ini, not here - pytest.ini takes precedence
# over [tool.pytest.ini_options] whenever both exist, so a duplicate
# section here would be silently ignored (confirmed: every real test run's
# own header reports "configfile: pytest.ini"). A previous version of this
# file had one anyway, diverging from pytest.ini in ways that were never
# actually in effect - removed rather than left as a second, dead source of
# truth.

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.hypothesis]
max_examples = 100
deadline = 5000  # 5 seconds per test
derandomize = false
print_blob = true

[tool.coverage.run]
source = ["custom_components/ha_dev_tools"]
omit = [
    "tests/*",
    "**/__pycache__/*",
    "**/test_*.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]
