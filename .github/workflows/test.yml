name: Test

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      
      - name: Run tests
        run: |
          PYTHONPATH=. pytest tests/ -v --cov=custom_components.ha_dev_tools --cov-report=term-missing --ignore=tests/property/
      
      - name: Run property-based tests
        run: |
          PYTHONPATH=. pytest tests/property/ -v --tb=short
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The same checks as .pre-commit-config.yaml, at the same versions. Until
  # this job existed nothing enforced them, so mypy errors and formatting
  # drift piled up on main unnoticed (issue #93). mypy runs against the
  # pinned homeassistant from requirements-test.txt, like the tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt black==26.5.1 isort==8.0.1 flake8==7.3.0 mypy==2.3.1

      - name: black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: flake8
        run: flake8 .

      - name: mypy
        run: mypy --ignore-missing-imports --python-version 3.14 custom_components/ha_dev_tools
