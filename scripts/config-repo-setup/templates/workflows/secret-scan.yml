name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # gitleaks scans history too - needs more than the default
          # single-commit shallow clone.
          fetch-depth: 0

      # Free for personal GitHub accounts, no license key needed - only
      # org-owned repos require one. See
      # https://github.com/gitleaks/gitleaks-action
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
